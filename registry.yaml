# Every resource this project's workflow acts on: this repository itself, the
# project-management entry that tracks it, and anything else a stage needs to reach.
#
# `jen init` writes this file once, and the project owns it from then on — jen never
# reads, rewrites, or deletes it afterward. Fill it in by hand.
#
# Each entry names the resource, says what kind of thing it is, and carries whatever a
# stage needs to reach it. The project itself is one of them — jen installed into this
# repository, with the project's own sources tracked under `src/` right here. There is no
# second repository to clone in; `path` says where in this one a stage finds the sources.
#
#   resources:
#     - name: acme-web
#       kind: repository
#       url: git@github.com:acme/acme-web.git
#       path: src/
#
#     - name: acme-web-tracker
#       kind: project-management
#       provider: linear
#       team: ENG
#       project: Acme Web
#       tracks: acme-web
#
# An entry *names* a resource. It never authenticates one. No private key, client secret,
# token, or password belongs in this file or in any other tracked file.

resources:
  # jen is its own project: the workflow lives at the root and jen's sources sit beside it
  # at `cli/` rather than `src/`, because jen is the tool, not an installation of it.
  - name: jen
    kind: repository
    url: git@github.com:reveer-ai/jen-cli.git
    path: cli/

  - name: jen-tracker
    kind: project-management
    provider: linear
    team: eng
    project: jen
    tracks: jen
