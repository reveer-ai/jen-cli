# Every resource this project's workflow acts on: this repository itself, the
# project-management entry that tracks it, and anything else a stage needs to reach.
#
# `jen init` writes this file once, and the project owns it from then on — jen never
# reads, rewrites, or deletes it afterward. Run the `setup-jen` skill to fill it in, or
# edit it by hand.
#
# Each entry names the resource, says what kind of thing it is, and carries whatever a
# stage needs to reach it. The project itself is one of them — jen installed into this
# repository, with the project's own sources tracked under `src/` right here. There is no
# second repository to clone in; `path` says where in this one a stage finds the sources.
#
#   resources:
#     - name: acme-web
#       kind: repository
#       url: git@github.com:acme/acme-web.git
#       path: src/
#
#     - name: acme-web-tracker
#       kind: project-management
#       provider: linear
#       team: ENG
#       project: Acme Web
#       tracks: acme-web
#
# The pipeline acts under registered identities rather than under a person: one application
# per role on the git host — `design`, `dev`, and `deliver` — and one agent shared by all
# three on the tracker. `setup-jen` guides you through registering them and records them
# here.
#
# An identity entry *names* an identity. It never authenticates one. No private key, client
# secret, token, or password belongs in this file or in any other tracked file — a run reads
# its credentials from its environment, and the two never meet on disk.
#
#     - name: acme-web-design
#       kind: identity
#       surface: git-host
#       provider: github
#       role: design
#       app: acme-web-design
#       app_id: 1234567
#       installation: 89012345
#       installed_on: acme-web
#
#     - name: acme-web-agent
#       kind: identity
#       surface: tracker
#       provider: linear
#       agent: jen
#       agent_id: 00000000-0000-0000-0000-000000000000
#
# `role` appears on git-host identities only. The tracker identity carries none, because one
# agent serves every role — which is why it is recorded once, belonging to the project rather
# than to any one of them.

resources:
  # jen is its own project: the workflow lives at the root and jen's sources sit beside it
  # at `cli/` rather than `src/`, because jen is the tool, not an installation of it.
  - name: jen
    kind: repository
    url: git@github.com:reveer-ai/jen-cli.git
    path: cli/

  - name: jen-tracker
    kind: project-management
    provider: linear
    team: eng
    project: jen
    tracks: jen

  - name: jen-design
    kind: identity
    surface: git-host
    provider: github
    role: design
    app: reveer-jen-design
    app_id: 4588648
    installation: 153578675
    installed_on: jen

  - name: jen-dev
    kind: identity
    surface: git-host
    provider: github
    role: dev
    app: reveer-jen-dev
    app_id: 4588651
    installation: 153578694
    installed_on: jen

  - name: jen-deliver
    kind: identity
    surface: git-host
    provider: github
    role: deliver
    app: reveer-jen-deliver
    app_id: 4588653
    installation: 153578706
    installed_on: jen

  - name: jen-agent
    kind: identity
    surface: tracker
    provider: linear
    agent: jen
    agent_id: 1d1170fc-5684-42c3-9214-1d20b1f2b3ff
